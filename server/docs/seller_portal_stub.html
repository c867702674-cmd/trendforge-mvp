<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TrendForge Seller Portal</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;padding:24px}
    .wrap{max-width:1100px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    h1{margin:0 0 8px} h2{font-size:18px;margin:0 0 12px}
    .muted{color:#666}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge Seller Portal</h1>
    <p class="muted">V13 SaaS-style dashboard stub</p>
    <div class="grid">
      <div class="card">
        <h2>Top Trends</h2>
        <p>Connect to dashboard_api.json / top_trend_board.json</p>
      </div>
      <div class="card">
        <h2>Execution Packs</h2>
        <p>Connect to execution_pack_viewer.html</p>
      </div>
      <div class="card">
        <h2>Priority Listings</h2>
        <p>Use listing_drafts.rank_score for ranking display</p>
      </div>
    </div>
  </div>
</body>
</html>
