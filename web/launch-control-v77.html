<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendForge V77 Launch Control</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#08111f;color:#eaf2ff}
    .wrap{width:min(1320px,95%);margin:28px auto 60px}
    h1{margin:0 0 12px;font-size:34px}
    .sub{color:#8fa9d1;line-height:1.7;margin-bottom:20px}
    .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .card{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;min-width:150px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    input,select{background:#0f1d36;color:#eaf2ff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
    .col{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
    .col h2{margin:0 0 12px;font-size:18px}
    .item{background:#0a1528;border-radius:14px;padding:12px;margin-bottom:12px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .release{background:#133b26;color:#82f2ad}
    .creative{background:#463713;color:#ffd66e}
    .poster{background:#17345f;color:#abd0ff}
    .reserve{background:#3b3349;color:#d9c5ff}
    .manual{background:#2b3a4f;color:#c9d7e8}
    .p0{background:#4b1d1d;color:#ffb3b3}.p1{background:#463713;color:#ffd66e}.p2{background:#17345f;color:#abd0ff}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .note{color:#9bb2d6;font-size:13px;line-height:1.5}
    @media (max-width:1200px){.grid{grid-template-columns:1fr 1fr}}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V77 Launch Control</h1>
    <div class="sub">在 V76 发布编排中心基础上，进一步整理为发布控制中心：CONTROL_RELEASE / CONTROL_CREATIVE / CONTROL_POSTER / CONTROL_RESERVE / CONTROL_MANUAL。</div>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <input id="q" placeholder="搜索标题 / SKU / 关键词" />
      <select id="priority">
        <option value="">全部优先级</option>
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
      </select>
      <select id="product"><option value="">全部产品</option></select>
    </div>
    <div class="grid">
      <div class="col"><h2>CONTROL_RELEASE</h2><div id="col-release"></div></div>
      <div class="col"><h2>CONTROL_CREATIVE</h2><div id="col-creative"></div></div>
      <div class="col"><h2>CONTROL_POSTER</h2><div id="col-poster"></div></div>
      <div class="col"><h2>CONTROL_RESERVE</h2><div id="col-reserve"></div></div>
      <div class="col"><h2>CONTROL_MANUAL</h2><div id="col-manual"></div></div>
    </div>
  </div>
  <script src="launch-control-v77.js"></script>
</body>
</html>
