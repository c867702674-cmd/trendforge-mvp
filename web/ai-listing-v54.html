<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TrendForge V54 AI Listing</title>
  <style>
    body{margin:0;background:#08101f;color:#eef2ff;font-family:Arial,sans-serif}
    .wrap{max-width:1240px;margin:0 auto;padding:24px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
    .card{background:#121933;border:1px solid #26315f;border-radius:18px;padding:18px}
    .muted{color:#98a2c8}
    .item{padding:10px 0;border-top:1px solid #26315f}
    .item:first-child{border-top:none}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .chip{padding:4px 10px;border-radius:999px;background:#0d1530;border:1px solid #26315f;font-size:12px}
    @media (max-width:960px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V54 AI Listing Engine</h1>
    <div id="grid" class="grid"></div>
  </div>
  <script src="./ai-listing-v54.js"></script>
</body>
</html>
