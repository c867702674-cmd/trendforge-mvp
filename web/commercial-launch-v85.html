<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendForge V85 Commercial Launch Console</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#08111f;color:#eaf2ff}
    .wrap{width:min(1450px,95%);margin:28px auto 60px}
    h1{margin:0 0 12px;font-size:36px} .sub{color:#8fa9d1;line-height:1.7;margin-bottom:18px}
    .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .card{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;min-width:170px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    input,select{background:#0f1d36;color:#eaf2ff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
    .col{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
    .col h2{margin:0 0 12px;font-size:18px}
    .item{background:#0a1528;border-radius:14px;padding:12px;margin-bottom:12px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .p0{background:#4b1d1d;color:#ffb3b3}.p1{background:#463713;color:#ffd66e}.p2{background:#17345f;color:#abd0ff}
    .safe{background:#133b26;color:#82f2ad}.review{background:#463713;color:#ffd66e}.block{background:#4b1d1d;color:#ffb3b3}
    .ready{background:#133b26;color:#82f2ad}.pending{background:#463713;color:#ffd66e}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .note{color:#9bb2d6;font-size:13px;line-height:1.5}
    @media (max-width:1200px){.grid{grid-template-columns:1fr 1fr}}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V85 Commercial Launch Console</h1>
    <div class="sub">正式商业上线控制台：LIVE_BATCH / ASSET_QUEUE / COMPLIANCE_QUEUE / POSTER_QUEUE / MANUAL_QUEUE。把上线队列、负责人、状态、发布包统一整理。</div>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <input id="q" placeholder="搜索标题 / SKU / 关键词" />
      <select id="priority"><option value="">全部优先级</option><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option></select>
      <select id="status"><option value="">全部发布状态</option><option value="READY_TO_PUSH">READY_TO_PUSH</option><option value="PENDING">PENDING</option></select>
      <select id="owner"><option value="">全部负责人</option><option value="operator">operator</option><option value="designer">designer</option></select>
    </div>
    <div class="grid">
      <div class="col"><h2>LIVE_BATCH</h2><div id="col-live"></div></div>
      <div class="col"><h2>ASSET_QUEUE</h2><div id="col-asset"></div></div>
      <div class="col"><h2>COMPLIANCE_QUEUE</h2><div id="col-compliance"></div></div>
      <div class="col"><h2>POSTER_QUEUE</h2><div id="col-poster"></div></div>
      <div class="col"><h2>MANUAL_QUEUE</h2><div id="col-manual"></div></div>
    </div>
  </div>
  <script src="commercial-launch-v85.js"></script>
</body>
</html>
