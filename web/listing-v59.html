<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendForge V59 Listing Engine</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#08111f;color:#eaf2ff}
    .wrap{width:min(1240px,94%);margin:28px auto 60px}
    h1{margin:0 0 12px;font-size:34px}
    .sub{color:#8fa9d1;line-height:1.7;margin-bottom:22px}
    .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .card{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;min-width:160px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    input,select{background:#0f1d36;color:#eaf2ff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
    .list{display:grid;gap:16px}
    .item{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
    .meta{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
    .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .safe{background:#133b26;color:#82f2ad}.review{background:#463713;color:#ffd66e}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .box{background:#0a1528;border-radius:12px;padding:12px}
    .label{font-size:12px;color:#8fa9d1;margin-bottom:6px;text-transform:uppercase}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (max-width: 920px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V59 Listing Engine</h1>
    <div class="sub">基于 V58 SAFE / REVIEW 结果，自动生成 POD Listing Draft：Title / Tags / Description / Design Prompt / SKU。</div>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <input id="q" placeholder="搜索关键词 / SKU / 标题" />
      <select id="product">
        <option value="">全部产品</option>
      </select>
      <select id="risk">
        <option value="">全部风险级别</option>
        <option value="SAFE">SAFE</option>
        <option value="REVIEW">REVIEW</option>
      </select>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script src="listing-v59.js"></script>
</body>
</html>
