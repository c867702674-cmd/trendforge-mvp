<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendForge V62 Publish Board</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#08111f;color:#eaf2ff}
    .wrap{width:min(1320px,95%);margin:28px auto 60px}
    h1{margin:0 0 12px;font-size:34px}
    .sub{color:#8fa9d1;line-height:1.7;margin-bottom:20px}
    .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .card{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;min-width:150px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    input,select{background:#0f1d36;color:#eaf2ff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .col{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
    .col h2{margin:0 0 12px;font-size:20px}
    .item{background:#0a1528;border-radius:14px;padding:12px;margin-bottom:12px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .ready{background:#133b26;color:#82f2ad}
    .waitart{background:#463713;color:#ffd66e}
    .review{background:#17345f;color:#abd0ff}
    .p0{background:#4b1d1d;color:#ffb3b3}.p1{background:#463713;color:#ffd66e}.p2{background:#17345f;color:#abd0ff}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .note{color:#9bb2d6;font-size:13px}
    @media (max-width:1000px){.board{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V62 Publish Board</h1>
    <div class="sub">把 V61 上架队列整理成可视化发布看板：READY_TO_PUBLISH / ARTWORK_PENDING / REVIEW_QUEUE。</div>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <input id="q" placeholder="搜索标题 / SKU / 关键词" />
      <select id="priority">
        <option value="">全部优先级</option>
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
      </select>
      <select id="product"><option value="">全部产品</option></select>
    </div>
    <div class="board">
      <div class="col">
        <h2>READY_TO_PUBLISH</h2>
        <div id="col-ready"></div>
      </div>
      <div class="col">
        <h2>ARTWORK_PENDING</h2>
        <div id="col-art"></div>
      </div>
      <div class="col">
        <h2>REVIEW_QUEUE</h2>
        <div id="col-review"></div>
      </div>
    </div>
  </div>
  <script src="publish-board-v62.js"></script>
</body>
</html>
