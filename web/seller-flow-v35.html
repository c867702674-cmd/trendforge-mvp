<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TrendForge Seller Flow V35</title>
  <style>
    body{margin:0;background:#08101f;color:#eef2ff;font-family:Arial,sans-serif}
    .wrap{max-width:1240px;margin:0 auto;padding:24px}
    .hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
    .card{background:#121933;border:1px solid #26315f;border-radius:18px;padding:18px}
    .muted{color:#98a2c8}
    .item{padding:10px 0;border-top:1px solid #26315f}
    .item:first-child{border-top:none}
    h1,h2{margin:0 0 12px}
    @media (max-width:960px){.hero{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V35 Seller Flow</h1>
    <div id="meta" class="muted" style="margin:10px 0 18px;"></div>
    <div class="hero">
      <div class="card"><h2>Opportunity Cards</h2><div id="cards"></div></div>
      <div class="card"><h2>Seller Alerts</h2><div id="alerts"></div></div>
      <div class="card"><h2>Subscription</h2><div id="subs"></div></div>
    </div>
  </div>
  <script src="./seller-flow-v35.js"></script>
</body>
</html>
