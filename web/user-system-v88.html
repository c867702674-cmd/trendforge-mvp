<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendForge V88 User System</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#08111f;color:#eaf2ff}
    .wrap{width:min(1450px,95%);margin:28px auto 60px}
    h1{margin:0 0 12px;font-size:36px} .sub{color:#8fa9d1;line-height:1.7;margin-bottom:18px}
    .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .card{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;min-width:170px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    input,select{background:#0f1d36;color:#eaf2ff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
    .list{display:grid;grid-template-columns:1fr;gap:16px}
    .item{background:#0d1a31;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
    .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .free{background:#17345f;color:#abd0ff}.pro{background:#463713;color:#ffd66e}.vip{background:#133b26;color:#82f2ad}
    .active{background:#133b26;color:#82f2ad}.disabled{background:#4b1d1d;color:#ffb3b3}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .panel{background:#0a1528;border-radius:14px;padding:12px}
    .label{font-size:12px;color:#8fa9d1;margin-bottom:8px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V88 User System</h1>
    <div class="sub">SaaS 用户系统第一版：Free / Pro / VIP，包含账号、Token、权限、每日趋势额度。做到这里，TrendForge 才真正进入 SaaS 商业化阶段。</div>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <input id="q" placeholder="搜索邮箱 / 用户名 / Token" />
      <select id="plan"><option value="">全部套餐</option><option value="free">free</option><option value="pro">pro</option><option value="vip">vip</option></select>
      <select id="status"><option value="">全部状态</option><option value="ACTIVE">ACTIVE</option><option value="DISABLED">DISABLED</option></select>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script src="user-system-v88.js"></script>
</body>
</html>
