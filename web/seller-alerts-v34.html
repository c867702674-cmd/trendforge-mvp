<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TrendForge Seller Alerts V34</title>
  <style>
    body{margin:0;background:#08101f;color:#eef2ff;font-family:Arial,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .card{background:#121933;border:1px solid #26315f;border-radius:18px;padding:18px}
    .muted{color:#98a2c8}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#0d1530;border:1px solid #26315f;font-size:12px;margin-bottom:10px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TrendForge V34 Seller Alerts</h1>
    <div id="grid" class="grid"></div>
  </div>
  <script src="./seller-alerts-v34.js"></script>
</body>
</html>
